<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Watch Wheel</title>
</head>
<body>
<div id="WatchWheelPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content">
        <div class="content-primary watchWheelShell">
            <div class="watchWheelHeader">
                <div><h1>Watch Wheel</h1><p>Can't decide what to watch? Let Jellyfin choose.</p></div>
                <div class="candidateBadge"><span id="candidateCount">0</span><span>choices</span></div>
            </div>
            <section class="filterPanel" aria-label="Wheel filters">
                <div class="filterField">
                    <label for="wwType">Media Type</label>
                    <select id="wwType" class="emby-select">
                        <option value="both">Movies + TV</option>
                        <option value="movie">Movies Only</option>
                        <option value="series">TV Shows Only</option>
                    </select>
                </div>
                <div class="filterField">
                    <label for="wwGenre">Genre</label>
                    <select id="wwGenre" class="emby-select"><option value="">Any Genre</option></select>
                </div>
                <div class="filterField">
                    <label for="wwDecade">Decade</label>
                    <select id="wwDecade" class="emby-select"><option value="">Any Decade</option></select>
                </div>
                <div class="filterField">
                    <label for="wwWatchStatus">Watch Status</label>
                    <select id="wwWatchStatus" class="emby-select"
                        title="For TV, In progress includes shows with any watched or partially watched regular episode.">
                        <option value="all">All unwatched</option>
                        <option value="not-started">Not started</option>
                        <option value="in-progress">In progress</option>
                    </select>
                </div>
                <div class="filterField filterCheckbox">
                    <label><input id="wwAvoidRecent" type="checkbox"><span>Avoid recent picks</span></label>
                </div>
                <button id="wwApplyFilters" type="button" class="raised emby-button button-submit">Refresh Wheel</button>
                <button id="wwResetFilters" type="button" class="raised emby-button">Reset Filters</button>
            </section>
            <p id="wwFilterNote" class="wwFilterNote" role="status"></p>
            <p id="wwStorageNote" class="wwStorageNote" role="status"></p>
            <div id="wwMessage" class="watchWheelMessage" role="status" aria-live="polite"></div>
            <section class="wheelSection" aria-label="Watch wheel">
                <div class="wheelContainer">
                    <div class="wheelPointer" aria-hidden="true"></div>
                    <canvas id="watchWheelCanvas" width="800" height="800" aria-label="Wheel of movie and TV choices"></canvas>
                    <button id="wwSpin" type="button" class="spinButton" disabled>SPIN</button>
                </div>
            </section>
            <section id="winnerCard" class="winnerCard hidden" aria-label="Selected title">
                <div class="winnerPosterWrapper"><img id="winnerPoster" class="winnerPoster" alt=""></div>
                <div class="winnerInfo">
                    <div class="winnerEyebrow">THE WHEEL HAS SPOKEN</div>
                    <h2 id="winnerTitle"></h2>
                    <div id="winnerMeta" class="winnerMeta"></div>
                    <div id="winnerEpisode" class="winnerEpisode"></div>
                    <div id="winnerResume" class="winnerResume"></div>
                    <div id="winnerGenres" class="winnerGenres"></div>
                    <p id="winnerOverview"></p>
                    <div class="winnerActions">
                        <button id="wwPlay" type="button" class="raised emby-button button-submit">Play</button>
                        <button id="wwOpen" type="button" class="raised emby-button">Details</button>
                        <button id="wwEpisode" type="button" class="raised emby-button hidden">Episode Details</button>
                        <button id="wwRemove" type="button" class="raised emby-button">Remove from Wheel</button>
                        <button id="wwAgain" type="button" class="raised emby-button">Spin Again</button>
                    </div>
                </div>
            </section>
            <section class="wwHistory" aria-labelledby="wwHistoryHeading">
                <div class="wwHistoryHeader">
                    <div><h2 id="wwHistoryHeading">Recent picks</h2><p>Your last 10 spins. Avoid recent picks skips these movies and entire shows.</p></div>
                    <button id="wwClearHistory" type="button" class="raised emby-button">Clear History</button>
                </div>
                <p id="wwHistoryEmpty">Your picks will appear here after you spin.</p>
                <ol id="wwHistoryList" class="wwHistoryList"></ol>
            </section>
        </div>
    </div>
    <script>
        (function () {
            var page = document.getElementById('WatchWheelPage');
            var version = 'filters-6';
            var cssId = 'watchWheelPluginCss';
            var css = document.getElementById(cssId);
            if (!css) {
                css = document.createElement('link');
                css.id = cssId;
                css.rel = 'stylesheet';
                document.head.appendChild(css);
            }
            css.href = 'configurationpage?name=watchWheel.css&v=' + version;
            function initialize() {
                if (window.WatchWheelApp) window.WatchWheelApp.init(page);
            }
            if (window.WatchWheelApp && window.watchWheelLoadedVersion === version) {
                initialize();
                return;
            }
            if (!window.watchWheelAssetLoad || window.watchWheelAssetVersion !== version) {
                window.watchWheelAssetVersion = version;
                window.watchWheelAssetLoad = new Promise(function (resolve, reject) {
                    var script = document.createElement('script');
                    script.src = 'configurationpage?name=watchWheel.js&v=' + version;
                    script.onload = function () {
                        window.watchWheelLoadedVersion = version;
                        resolve();
                    };
                    script.onerror = function () {
                        window.watchWheelAssetLoad = null;
                        reject(new Error('Watch Wheel script failed to load.'));
                    };
                    document.head.appendChild(script);
                });
            }
            window.watchWheelAssetLoad.then(initialize).catch(function (error) {
                console.error(error);
                var message = page && page.querySelector('#wwMessage');
                if (message) message.textContent = 'Watch Wheel assets could not load. Reload the page.';
            });
        })();
    </script>
</div>
</body>
</html>
